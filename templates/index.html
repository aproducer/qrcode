<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ site_name }}</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }
        .hero {
            display: flex;
            gap: 20px;
            align-items: stretch;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 20px;
        }
        .grow { flex: 1 1 620px; }
        .qr-panel { flex: 0 0 280px; text-align: center; }
        h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }
        p { margin: 0; color: var(--muted); }
        .meta {
            margin-top: 14px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: #f8fafc;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 14px;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            border: none;
            background: #0f172a;
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { opacity: 0.92; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }
        .device-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 18px;
        }
        .device-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .device-title {
            font-size: 18px;
            font-weight: 700;
        }
        .device-id {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }
        .status {
            padding: 6px 10px;
            border-radius: 999px;
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
        }
        .running { background: var(--ok); }
        .warning { background: var(--warn); }
        .error { background: var(--err); }
        .kv {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 16px 0;
        }
        .item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
        }
        .item .label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .item .value {
            font-size: 20px;
            font-weight: 700;
        }
        .msg {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            min-height: 44px;
        }
        .links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .link-btn {
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            background: #fff;
        }
        .qr-img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            border-radius: 12px;
            background: #fff;
            border: 1px solid var(--border);
            padding: 8px;
        }
        @media (max-width: 640px) {
            .wrap { padding: 16px; }
            h1 { font-size: 24px; }
            .kv { grid-template-columns: 1fr; }
            .qr-panel { flex-basis: 100%; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hero">
            <section class="panel grow">
                <h1>{{ site_name }}</h1>
                <p>这是一个可直接部署到公网的演示页面。上线后，二维码会自动指向当前公网地址，手机扫码即可访问。</p>
                <div class="meta">
                    <div class="badge">首页二维码自动生成</div>
                    <div class="badge">设备详情页支持独立二维码</div>
                    <div class="badge">前端自动轮询刷新</div>
                </div>
            </section>
            <aside class="panel qr-panel">
                <h3>首页二维码</h3>
                <img class="qr-img" src="/qrcode" alt="首页二维码" />
                <p style="margin-top: 10px;">手机扫码访问当前公网首页</p>
            </aside>
        </div>

        <div class="toolbar">
            <div id="summary" class="badge">正在加载数据</div>
            <button onclick="fetchData()">刷新数据</button>
        </div>

        <div id="device-grid" class="grid"></div>
    </div>

    <script>
        function statusClass(status) {
            if (status === 'running') return 'running';
            if (status === 'warning') return 'warning';
            return 'error';
        }

        function prettyStatus(status) {
            const map = {
                running: '运行中',
                warning: '预警',
                error: '异常'
            };
            return map[status] || status;
        }

        function renderDevices(payload) {
            const grid = document.getElementById('device-grid');
            const devices = payload.devices || [];
            document.getElementById('summary').innerText = `最后更新时间：${payload.updated_at || '-'} ｜ 设备数：${devices.length}`;

            if (!devices.length) {
                grid.innerHTML = '<div class="panel">暂无设备数据</div>';
                return;
            }

            grid.innerHTML = devices.map(device => `
                <article class="device-card">
                    <div class="device-top">
                        <div>
                            <div class="device-title">${device.name || device.device_id}</div>
                            <div class="device-id">${device.device_id}</div>
                        </div>
                        <div class="status ${statusClass(device.status)}">${prettyStatus(device.status)}</div>
                    </div>
                    <div class="kv">
                        <div class="item">
                            <div class="label">温度</div>
                            <div class="value">${device.temperature ?? '-'} °C</div>
                        </div>
                        <div class="item">
                            <div class="label">湿度</div>
                            <div class="value">${device.humidity ?? '-'} %</div>
                        </div>
                        <div class="item">
                            <div class="label">电压</div>
                            <div class="value">${device.voltage ?? '-'} V</div>
                        </div>
                        <div class="item">
                            <div class="label">电流</div>
                            <div class="value">${device.current ?? '-'} A</div>
                        </div>
                    </div>
                    <div class="msg">${device.message || '暂无说明'}</div>
                    <div class="links">
                        <a class="link-btn" href="/device/${device.device_id}">打开详情</a>
                        <a class="link-btn" href="/qrcode/device/${device.device_id}" target="_blank">查看该设备二维码</a>
                    </div>
                </article>
            `).join('');
        }

        async function fetchData() {
            try {
                const res = await fetch('/api/data', { cache: 'no-store' });
                const payload = await res.json();
                renderDevices(payload);
            } catch (err) {
                document.getElementById('summary').innerText = '数据加载失败';
                document.getElementById('device-grid').innerHTML = '<div class="panel">接口异常，请检查后端服务。</div>';
            }
        }

        fetchData();
        setInterval(fetchData, 15000);
    </script>
</body>
</html>
