<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ device_name }} - {{ site_name }}</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 20px;
        }
        .head {
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 18px;
            align-items: start;
        }
        .title {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .sub {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }
        .qr-img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            border-radius: 12px;
            background: #fff;
            border: 1px solid var(--border);
            padding: 8px;
        }
        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            color: #fff;
            font-size: 13px;
        }
        .running { background: var(--ok); }
        .warning { background: var(--warn); }
        .error { background: var(--err); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 18px;
        }
        .item {
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 14px;
        }
        .label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .value {
            font-size: 26px;
            font-weight: 800;
        }
        .note {
            margin-top: 18px;
            line-height: 1.8;
            color: var(--muted);
        }
        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .btn {
            display: inline-block;
            border: 1px solid var(--border);
            background: #fff;
            padding: 10px 14px;
            border-radius: 10px;
        }
        @media (max-width: 720px) {
            .head { grid-template-columns: 1fr; }
            .title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <section class="panel">
            <div class="head">
                <div>
                    <div class="title">{{ device_name }}</div>
                    <div class="sub">设备编号：{{ device_id }}。该页面适合为单台设备生成独立公网二维码，贴在设备、工位或展板上，扫码即可直达该设备详情页。</div>
                    <div id="status-tag" class="status">加载中</div>
                </div>
                <div style="text-align:center;">
                    <img class="qr-img" src="/qrcode/device/{{ device_id }}" alt="设备二维码" />
                    <div class="sub" style="margin-top:10px;">扫码进入当前设备页面</div>
                </div>
            </div>

            <div id="device-grid" class="grid"></div>
            <div id="message" class="note">正在读取设备数据。</div>

            <div class="actions">
                <a class="btn" href="/">返回首页</a>
                <a class="btn" href="/api/device/{{ device_id }}" target="_blank">查看原始 JSON</a>
            </div>
        </section>
    </div>

    <script>
        function statusClass(status) {
            if (status === 'running') return 'running';
            if (status === 'warning') return 'warning';
            return 'error';
        }

        function prettyStatus(status) {
            const map = { running: '运行中', warning: '预警', error: '异常' };
            return map[status] || status;
        }

        async function fetchDevice() {
            try {
                const res = await fetch('/api/device/{{ device_id }}', { cache: 'no-store' });
                const payload = await res.json();
                if (!res.ok) {
                    throw new Error(payload.error || 'device not found');
                }

                const d = payload.device;
                const tag = document.getElementById('status-tag');
                tag.className = `status ${statusClass(d.status)}`;
                tag.innerText = prettyStatus(d.status);

                document.getElementById('device-grid').innerHTML = `
                    <div class="item"><div class="label">温度</div><div class="value">${d.temperature ?? '-'} °C</div></div>
                    <div class="item"><div class="label">湿度</div><div class="value">${d.humidity ?? '-'} %</div></div>
                    <div class="item"><div class="label">电压</div><div class="value">${d.voltage ?? '-'} V</div></div>
                    <div class="item"><div class="label">电流</div><div class="value">${d.current ?? '-'} A</div></div>
                `;
                document.getElementById('message').innerText = `说明：${d.message || '暂无说明'} ｜ 最后更新时间：${payload.updated_at || '-'}`;
            } catch (err) {
                document.getElementById('message').innerText = '读取设备数据失败，请检查后端或设备编号。';
            }
        }

        fetchDevice();
        setInterval(fetchDevice, 15000);
    </script>
</body>
</html>
